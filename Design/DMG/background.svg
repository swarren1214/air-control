  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glowA)"/>
  <rect width="640" height="400" fill="url(#glowB)"/>
  <path d="M -20 300 C 140 250, 230 330, 380 280 S 560 220, 660 250" fill="none" stroke="url(#air)" stroke-width="14" stroke-linecap="round"/>
