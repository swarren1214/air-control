<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F6FF"/>
      <stop offset="1" stop-color="#EAF6FA"/>
    </linearGradient>
    <radialGradient id="glowA" cx="90" cy="40" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8F86F0" stop-opacity="0.22"/>
