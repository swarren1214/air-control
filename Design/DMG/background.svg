    </radialGradient>
    <linearGradient id="air" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4B3BC4" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4B5BD8" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#0A93A8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A93A8" stop-opacity="0"/>
    </linearGradient>
